services:
    db:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${DB_USERNAME:?Configure DB_USERNAME in apps/backend/.env}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD in apps/backend/.env}
            POSTGRES_DB: ${DB_DATABASE:?Configure DB_DATABASE in apps/backend/.env}
        ports:
            - "127.0.0.1:${DB_PORT:-5432}:5432"
        volumes:
            - data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
            interval: 5s
            timeout: 5s
            retries: 5
volumes:
    data: {}
